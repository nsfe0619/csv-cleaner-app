<div class="csv-uploader">
  <h2>CSV 上傳與資料清洗</h2>

  <input type="file" (change)="handleFileUpload($event)" accept=".csv">

  <div *ngIf="fileSizeBefore > 0">
    <p>📂 原始檔案大小: {{ fileSizeBefore | number }} Bytes</p>
  </div>

  <button (click)="processCsvJs()" [disabled]="!rawCsv">清洗 CSV (JavaScript)</button>
  <button (click)="processCsvWasm()" [disabled]="!rawCsv">清洗 CSV (WASM)</button>

  <div *ngIf="cleanedCsvJs">
    <h3>✅ JavaScript 清洗結果</h3>
    <p>📂 清洗後檔案大小: {{ fileSizeAfterJs | number }} Bytes</p>
    <p>⏱️ 清洗時間: {{ cleaningTimeJs }} 毫秒</p>
    <button (click)="downloadCsv('js')">下載 (JavaScript)</button>
  </div>

  <div *ngIf="cleanedCsvWasm">
    <h3>✅ WASM 清洗結果</h3>
    <p>📂 清洗後檔案大小: {{ fileSizeAfterWasm | number }} Bytes</p>
    <p>⏱️ 清洗時間: {{ cleaningTimeWasm }} 毫秒</p>
    <button (click)="downloadCsv('wasm')">下載 (WASM)</button>
  </div>
</div>
